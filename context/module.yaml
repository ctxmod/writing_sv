title: Swedish Writing
description: >-
  Swedish writing doctrine and sources: Språkrådet's rule literature
  (Snabba skrivregler; Myndigheternas skrivregler; Parallella fackspråk
  on terminology and parallel language) as digests with metadata-only
  bibliography, Swedish mechanics, editorial policy for a Swedish
  publication, and Swedish application of the writing module's genres:
  correspondence and sales messages, commercial documents, job
  applications, web copy, and translation. Reader adaptation
  (mottagaranpassning) and a catalogue of Swedish machine tells
  extend the writing module's reader, integrity and machine_tells
  doctrine. Sources are pointers into
  external material; the module carries digests and summaries, not
  copies. Personal style belongs in a consumer's own module.
path: github.com/ctxmod/writing_sv/context
requires:
  - github.com/ctxmod/writing/context
default_profiles:
  - core
