title: Svenskt skrivande — kärna
description: >-
  Modulens gemensamma bas: neutral standardsvenska enligt Språkrådets
  skrivregler — skiljetecken och strecktestet, versaler och
  sammansättningar, förkortningar och tal, datum och klockslag, samt
  referat, citat och källhänvisning; svenska skriven från sakunderlaget,
  "affären" som inte betyder verksamheten, klarspråk, hen och SAOL 15,
  svenska exempel till
  skrivmodulens grundprinciper, och digester ur Snabba skrivregler och
  Myndigheternas skrivregler med bibliografin som metadatakällor;
  mottagaranpassning på svenska (läsarens frågor först, tilltalet, en
  synlig avsändare, det återhållsamma registret och avsändarens ansvar
  för text från en språkmodell) och katalogen över maskinsvenska.
  Skrivmodulens kärna (modulen writing) bär de språkoberoende
  principerna; övriga profiler här bygger på denna kärna.
packages:
  defaults:
    - regler
    - former
    - kallor
    - mottagaren
    - maskinsvenska
