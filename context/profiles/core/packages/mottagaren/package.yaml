description: >-
  Mottagaranpassning på svenska ovanpå skrivmodulens paket reader och
  integrity: Isofs råd om att börja med läsarens frågor, hälsa och tacka
  utan utfyllnad, tilltalet med du, ni, vi och jag (med gemen), en
  synlig avsändare, ton efter avsändare, texttyp och kanal, det
  återhållsamma svenska registret och var det är omstritt, text som
  håller när den sammanfattas maskinellt, avsändarens ansvar för text
  som tagits fram med en språkmodell, och vad som är känt om hur
  svenska läsare tar emot maskinskrivet material.
binds_to_depth: main...
