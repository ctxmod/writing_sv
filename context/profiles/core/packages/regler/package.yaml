description: >-
  Neutral standardsvenskans grundregler: skiljetecken och strecktestet,
  versaler, sammansättningar och det bokstavliga snabel-a i
  triggerposition; svenska skriven från sakunderlaget och "affären";
  svenska exempel till skrivmodulens grundprinciper; och digesterna ur
  Isofs Snabba skrivregler (2024) och Språkrådets Myndigheternas
  skrivregler (2014), med hänvisningar till avsnittsnummer. Källornas
  bibliografi står som metadatakällor i profilens sources/
  (skrivregler, parallellsprak, myndigheternas_skrivregler);
  publikationernas text är upphovsrättsskyddad och kopieras aldrig in i
  modulen.
binds_to_depth: main...
