description: >-
  Svensk korrespondens: inledningar som ger poängen, ämnesraden,
  konkreta tider, svenska par för det som gagnar meddelandet, hälsningar
  och innekretsregistret, och svar på ställda frågor, med
  motivationsfrågor som besvaras med motivation, mallton i svenska
  mejl och okänd mottagare (funktion i stället för "Till den det
  berör"). E-postens
  grundregler för webbsammanhang finns också i profilen webb (e_post).
binds_to_depth: main...
